[project]
name = "dtf-dotfiles"
dynamic = ["version"]
description = "Collect and deploy Linux dotfiles from a separate configuration repository"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dev0xffh" }]
keywords = ["dotfiles", "configuration", "cli", "linux"]
dependencies = [
  "json5>=0.12.0",
  "tomlkit>=0.13.3",
]

[project.scripts]
dtf = "dotfiles.cli:main"

[project.urls]
Repository = "https://github.com/dev0xffh/dtf"
Issues = "https://github.com/dev0xffh/dtf/issues"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dotfiles/cli.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dotfiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
